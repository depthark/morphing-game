<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Retro games that morph under your hands: Snake → Chomper → Bomber → Alien Raid → Paddle → Flapper → Blockfall." />
    <title>MORPH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><rect width='8' height='8' fill='%23000'/><path fill='%238dff6a' d='M1 3h3v2H1zM4 1h2v2H4z'/><path fill='%23ff4f5e' d='M6 5h1v1H6z'/></svg>" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="hud-side hud-left">
          <div id="lives" aria-label="Lives">♥♥♥♥♥</div>
          <div id="round">GAME 1/7</div>
        </div>
        <div class="hud-center">
          <div id="score">000000</div>
          <div id="gname">SNAKE</div>
          <div id="bar" class="bar"><div id="bar-fill"></div></div>
          <div id="mlabel">&nbsp;</div>
        </div>
        <div class="hud-side hud-right">
          <div id="best">HI 0</div>
          <div class="btns">
            <button id="pause-btn" type="button" aria-label="Pause">II</button>
            <button id="mute" type="button" aria-label="Sound">♪</button>
          </div>
        </div>
      </header>
      <main id="stage">
        <canvas id="game" aria-label="Game board"></canvas>
        <div id="screen" class="screen"></div>
      </main>
      <footer id="hint" aria-live="polite"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
